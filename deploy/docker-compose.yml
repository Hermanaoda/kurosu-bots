# Les trois bots sur un serveur Docker. Lancement depuis la racine du dépôt :
#   cp deploy/.env.example deploy/.env   (puis renseignez les clés)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
x-bot: &bot
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }   # rotation des journaux
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 256m
  cpus: 0.5

services:
  cinema:
    <<: *bot
    build: { context: .., dockerfile: bots/cinema/Dockerfile }
    environment:
      GPCHAT_API_KEY: ${CINEMA_GPCHAT_API_KEY:?clé API du bot Ciné Club}
      TMDB_TOKEN: ${TMDB_TOKEN:?jeton TMDB}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
    ports: ["127.0.0.1:9101:9100"]   # /healthz /readyz /metrics (jamais exposés sur Internet)
    volumes: ["cinema-data:/data"]

  kurosu:
    <<: *bot
    build: { context: .., dockerfile: bots/kurosu/Dockerfile }
    environment:
      GPCHAT_API_KEY: ${KUROSU_GPCHAT_API_KEY:?clé API du bot Kurosu}
      TMDB_TOKEN: ${TMDB_TOKEN:?jeton TMDB}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
    ports: ["127.0.0.1:9106:9100"]
    volumes: ["kurosu-data:/data"]

  # Le Guide DevFest tourne en production sur Firebase (webhook) : version Docker seulement sur demande
  # (docker compose --profile devfest up -d devfest), sinon deux consommateurs pour le même bot.
  devfest:
    <<: *bot
    profiles: [devfest]
    build: { context: .., dockerfile: bots/devfest/Dockerfile }
    environment:
      GPCHAT_API_KEY: ${DEVFEST_GPCHAT_API_KEY:-}
      ADMIN_IDS: ${DEVFEST_ADMIN_IDS:-}
    ports: ["127.0.0.1:9102:9100"]
    volumes: ["devfest-data:/data"]   # déposez-y program.json pour remplacer celui du dépôt

  dev-alerts:
    <<: *bot
    build: { context: .., dockerfile: bots/dev-alerts/Dockerfile }
    environment:
      GPCHAT_API_KEY: ${ALERTS_GPCHAT_API_KEY:?clé API du bot Dev Alerts}
      PUBLIC_URL: ${ALERTS_PUBLIC_URL:?adresse publique HTTPS, ex. https://alertes.example.com}
    ports: ["127.0.0.1:18090:8080", "127.0.0.1:9103:9100"]   # webhooks entrants (derrière un reverse proxy HTTPS) et exploitation
    volumes: ["alerts-data:/data"]

  # Bots activés à la demande : docker compose --profile reminders --profile football up -d
  reminders:
    <<: *bot
    profiles: [reminders]
    build: { context: .., dockerfile: bots/reminders/Dockerfile }
    environment:
      GPCHAT_API_KEY: ${REMINDERS_GPCHAT_API_KEY:-}
      DEFAULT_TZ: ${REMINDERS_DEFAULT_TZ:-Africa/Douala}
    ports: ["127.0.0.1:9104:9100"]
    volumes: ["reminders-data:/data"]

  football:
    <<: *bot
    profiles: [football]
    build: { context: .., dockerfile: bots/football/Dockerfile }
    environment:
      GPCHAT_API_KEY: ${FOOTBALL_GPCHAT_API_KEY:-}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      LIVE_POLL_SECONDS: ${FOOTBALL_LIVE_POLL_SECONDS:-60}
      QUOTA_RESERVE: ${FOOTBALL_QUOTA_RESERVE:-50}   # offre gratuite (100/jour) : 10
      DEFAULT_TZ: ${FOOTBALL_DEFAULT_TZ:-Africa/Douala}
    ports: ["127.0.0.1:9105:9100"]
    volumes: ["football-data:/data"]

volumes:
  cinema-data:
  kurosu-data:
  devfest-data:
  alerts-data:
  reminders-data:
  football-data:
